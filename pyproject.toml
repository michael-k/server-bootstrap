[project]
name = "vps-bootstrap-playbook"
version = "0.1.0"
description = "Ansible playbook for bootstrapping fresh VPS servers with hardened security configuration"
requires-python = ">=3.11"
dependencies = [
    "ansible-core>=2.16.0",
    "pytest>=8.0.0",
    "hypothesis>=6.98.0",
]

[project.optional-dependencies]
dev = [
    "pytest-ansible>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hypothesis]
max_examples = 100
