[project]
name = "vps-bootstrap-playbook"
version = "0.1.0"
description = "Ansible playbook for bootstrapping fresh VPS servers with hardened security configuration"
requires-python = ">=3.14"
dependencies = [
    "ansible-core>=2.20.3",
    "passlib>=1.7.4",
]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"}
]
lint = [
  "ansible-lint>=26.1.1",
  "ruff>=0.15.2",
  "ty>=0.0.23",
]
test = [
    "hypothesis>=6.151.9",
    "incus[fixtures]",
    "pytest>=9.0.2",
    "pytest-ansible>=26.2.0",
]


# INERT.  Hypothesis 6.151.9 contains no code that reads pyproject.toml and
# exposes no settings loader for it; neither conftest.py in this repository
# registers or loads a settings profile.  The example budget that actually
# applies comes from the per-test @settings() decorators in tests/property/
# (71 at max_examples=100, 19 at max_examples=50).  The 100 below coincides
# with Hypothesis's own built-in default, which is why this block has read as
# working configuration.  See the testing spec's TEST-7.
[tool.hypothesis]
max_examples = 100


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# The testing spec's TEST-1 and TEST-5 are cited from the Makefile, where these
# markers are actually passed to pytest: this file is outside
# tests/spec_check.py's SCAN_GLOBS and cannot carry a citation.
# Measured: `unit` and `integration` partition the 490 collected tests (443 and
# 47, with no overlap); `property` is a strict subset of `unit` (187), not a
# third tier; `slow` currently selects exactly the same 47 tests as
# `integration`, despite the description below.  `--strict-markers` is not set,
# so a misspelled marker warns rather than failing.
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "property: marks tests as property-based tests using Hypothesis",
    "integration: marks tests as integration tests (require actual system/VM)",
    "slow: marks tests as slow-running",
]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["incus"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"incus/src/incus/*" = ["S101"]  # Allow assert in fixtures/infra code


[tool.ty.rules]
# Hypothesis @given() strategies use ParamSpec that ty can't resolve
missing-argument = "ignore"


[tool.uv]
default-groups = ["dev"]
environments = [
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[tool.uv.sources]
incus = { path = "incus", editable = true }

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple"
default = true
