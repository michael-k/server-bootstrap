[project]
name = "vps-bootstrap-playbook"
version = "0.1.0"
description = "Ansible playbook for bootstrapping fresh VPS servers with hardened security configuration"
requires-python = ">=3.14"
dependencies = [
    "ansible-core>=2.20.3",
    "passlib>=1.7.4",
]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"}
]
lint = [
  "ansible-lint>=26.1.1",
  "ruff>=0.15.2",
  "ty>=0.0.23",
]
test = [
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
    "pytest-ansible>=26.2.0",
]


[tool.hypothesis]
max_examples = 100


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "property: marks tests as property-based tests using Hypothesis",
    "integration: marks tests as integration tests (require actual system/VM)",
    "slow: marks tests as slow-running",
]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"incus/*" = ["S101"]  # Allow assert in fixtures/infra code


[tool.ty.rules]
# Hypothesis @given() strategies use ParamSpec that ty can't resolve
missing-argument = "ignore"


[tool.uv]
default-groups = ["dev"]
environments = [
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple"
default = true
