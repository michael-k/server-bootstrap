---
# Handlers for system_config role

- name: Verify hostname persistence
  ansible.builtin.command: hostname
  register: hostname_check
  changed_when: false

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
  when: time_sync_service == "chrony"

- name: Restart systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted
  when: time_sync_service == "timesyncd"
