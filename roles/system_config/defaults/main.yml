---
# Default variables for system_config role

# system_hostname
# HOST-1: hostname to apply, read by hostname.yml when non-empty.
# HOST-4: empty (the default) or undefined skips hostname configuration
# entirely.
system_hostname: ""

# Time synchronization service choice
# TIME-1: selects which service is installed, configured, enabled and
# started; TIME-2 stops and disables whichever one is not selected.
# Options: "chrony" or "timesyncd"
time_sync_service: "chrony"

# NTP servers for time synchronization
# TIME-3: configurable list, defaulting to the Debian pool.
ntp_servers:
  - "0.debian.pool.ntp.org"
  - "1.debian.pool.ntp.org"
  - "2.debian.pool.ntp.org"
  - "3.debian.pool.ntp.org"
