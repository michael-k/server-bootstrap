---
# Hostname configuration tasks
# HOST-1, HOST-2, HOST-3
#
# Sets the system hostname and ensures it persists across reboots.
# This task file is only included when system_hostname is defined and non-empty.

# HOST-1: set the running hostname to the configured value immediately.
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ system_hostname }}"
  notify: Verify hostname persistence

# HOST-2: persist across reboots by writing /etc/hostname, which nothing
# else reloads the running name from at boot.
- name: Update /etc/hostname for persistence
  ansible.builtin.copy:
    content: "{{ system_hostname }}\n"
    dest: /etc/hostname
    owner: root
    group: root
    mode: "0644"

# HOST-3: keep /etc/hosts's 127.0.1.1 entry pointed at the configured
# hostname, so sudo and other local-hostname lookups resolve it without
# stalling on DNS.
- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1\\s+"
    line: "127.0.1.1       {{ system_hostname }}"
    state: present
