---
# Time synchronization configuration tasks
# Requirements: 12.1, 12.2, 12.3, 12.4, 12.5
#
# Configures either chrony or systemd-timesyncd for NTP time synchronization.
# Chrony is preferred for better accuracy and features, but systemd-timesyncd
# is a lighter alternative suitable for most use cases.

# Chrony Configuration Path
# ========================

# Requirement 12.1: Install time synchronization service (chrony)
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
  when: time_sync_service == "chrony"

# Ensure systemd-timesyncd is not running when using chrony
# Only one NTP service should be active at a time
- name: Stop and disable systemd-timesyncd when using chrony
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  when: time_sync_service == "chrony"
  failed_when: false

# Requirement 12.2: Configure NTP servers
# Deploy chrony configuration with specified NTP server list
- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  when: time_sync_service == "chrony"
  notify: Restart chrony

# Requirement 12.3: Enable time sync service to start on boot
# Requirement 12.4: Start time sync service
- name: Enable and start chrony service
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  when: time_sync_service == "chrony"

# Requirement 12.5: Verify time synchronization is active
# chronyc tracking shows current synchronization status
- name: Verify chrony synchronization status
  ansible.builtin.command: chronyc tracking
  register: chrony_status
  changed_when: false
  when: time_sync_service == "chrony"

- name: Display chrony synchronization status
  ansible.builtin.debug:
    msg: "Chrony synchronization status: {{ chrony_status.stdout_lines }}"
  when: time_sync_service == "chrony"

# Systemd-timesyncd Configuration Path
# ====================================

# Ensure chrony is not running when using systemd-timesyncd
# Only one NTP service should be active at a time
- name: Stop and disable chrony when using systemd-timesyncd
  ansible.builtin.systemd:
    name: chrony
    state: stopped
    enabled: false
  when: time_sync_service == "timesyncd"
  failed_when: false

# Requirement 12.2: Configure NTP servers
# Deploy systemd-timesyncd configuration with specified NTP server list
- name: Configure systemd-timesyncd
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    owner: root
    group: root
    mode: "0644"
  when: time_sync_service == "timesyncd"
  notify: Restart systemd-timesyncd

# Requirement 12.3: Enable time sync service to start on boot
# Requirement 12.4: Start time sync service
- name: Enable and start systemd-timesyncd service
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
  when: time_sync_service == "timesyncd"

# Requirement 12.5: Verify time synchronization is active
# timedatectl timesync-status shows current synchronization status
- name: Verify systemd-timesyncd synchronization status
  ansible.builtin.command: timedatectl timesync-status
  register: timesyncd_status
  changed_when: false
  when: time_sync_service == "timesyncd"

- name: Display systemd-timesyncd synchronization status
  ansible.builtin.debug:
    msg: "Systemd-timesyncd synchronization status: {{ timesyncd_status.stdout_lines }}"
  when: time_sync_service == "timesyncd"
