---
# Fail2ban Role - Main Tasks
# Requirements: F2B-1, F2B-2, F2B-3, F2B-13, F2B-14, F2B-15

- name: Install fail2ban package
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  tags:
    - fail2ban
    - security
  # F2B-1: the distribution's package supplies the jail definitions, the sshd
  # filter's regular expressions, the nftables ban action and a unit ordered
  # after nftables.service; the cache refresh is for a host whose package
  # index predates this run.

- name: Ensure fail2ban configuration directory exists
  ansible.builtin.file:
    path: /etc/fail2ban
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags:
    - fail2ban
    - security
  # F2B-2: the package already creates this directory, so this task states its
  # mode and ownership rather than creating it, and reconverges a host where
  # either has drifted.

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    owner: root
    group: root
  notify: restart fail2ban
  tags:
    - fail2ban
    - security
  # F2B-3: jail.local is read after the packaged jail.conf and after
  # jail.d/*.conf, so this project overrides the package without editing a
  # file a package upgrade would replace.
  # F2B-15: this is the only task in the role that notifies the handler, so an
  # unchanged jail configuration leaves the running server alone.

- name: Enable fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
  tags:
    - fail2ban
    - security
  # F2B-13: the packaged unit declares After=nftables.service, so enabling it
  # is what puts the jail's table back after every boot's ruleset load.

- name: Start fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    state: started
  tags:
    - fail2ban
    - security
  # F2B-14: the deployed configuration does nothing until a server reads it,
  # so a completed run leaves the service running, not merely enabled.
