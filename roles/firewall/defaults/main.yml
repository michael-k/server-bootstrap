---
# Firewall Role - Default Variables

# FW-14: the SSH port is derived from the ssh_hardening role's ssh_port rather
# than configured twice, so the rule and the daemon's Port directive cannot
# name different ports. The fallback applies only where that role is absent.
firewall_ssh_port: "{{ ssh_port | default(22) }}"

# The Tailscale enrolment flag, inherited from the tailscale role. It selects
# which SSH exposure branch the ruleset renders: the tailnet-only rule (FW-10)
# with the WireGuard port open (FW-12) when true, and otherwise either the
# knock-gated branch or the open one (FW-13).
firewall_tailscale_enabled: "{{ tailscale_enabled | default(false) }}"

# FW-11: the interface name the tailnet-only SSH rule matches on, inherited
# from the tailscale role so both roles narrow to the same interface.
firewall_tailscale_interface: "{{ tailscale_interface | default('tailscale0') }}"

# Tailscale IPv4 address, published by the tailscale role's verify.yml tasks.
# No rule in this role reads it: the tailnet-only rule matches the interface,
# not an address. See the firewall design's failure modes.
firewall_tailscale_ipv4: "{{ tailscale_ipv4 | default('') }}"

# FW-12: the UDP port Tailscale's WireGuard traffic is accepted on. 41641 is
# the client's default listening port; a deployment that moves it must change
# this too, because nothing here reads the port back from the client.
firewall_wireguard_port: 41641

# KNOCK-10: the four knock variables, each derived from the identically named
# top-level variable so an operator configures knocking once in inventory and
# both the ruleset and site.yml's controller-side knock play see it.
#
# KNOCK-1: this flag, together with firewall_tailscale_enabled above, selects
# the knock branch. It defaults to true, so a host with no tailnet is
# knock-gated unless the operator turns it off.
firewall_port_knocking_enabled: "{{ port_knocking_enabled | default(true) }}"
# The sequence is exactly three ports (KNOCK-2) and its default is public,
# so it buys removal from untargeted scanning and nothing against anyone who
# has read this repository. See the port-knocking spec.
firewall_port_knocking_sequence: "{{ port_knocking_sequence | default([7000, 8500, 9100]) }}"
# KNOCK-7: the two windows the sets expire on. 30s is how long a completed
# knock stays usable — long enough to open an SSH connection, after which
# FW-6 keeps it alive regardless. 5s bounds how long a partial sequence is
# worth anything. Neither is extended by re-knocking.
firewall_port_knocking_timeout: "{{ port_knocking_timeout | default(30) }}"
firewall_port_knocking_stage_timeout: "{{ port_knocking_stage_timeout | default(5) }}"
