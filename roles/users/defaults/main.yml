---
# Default variables for users role
# These can be overridden in inventory or playbook variables

# Manual Access User Configuration (uid 1000)
# USR-2: the manual account's name is configurable.
manual_user_name: "admin"
# USR-1: uid 1000 is a contract with purpose repos, not a preference.
manual_user_uid: 1000
# USR-10, USR-11: configurable path, resolved on the controller.
manual_user_ssh_key_file: "~/.ssh/id_ed25519_admin.pub"
# USR-7: login shell.
manual_user_shell: "/bin/bash"
# USR-8: supplementary groups, appended to whatever the account already has.
manual_user_groups: []
# USR-3: manual_user_password has no default here on purpose — it is supplied
# from the vault.
# Example: ansible-playbook -e "manual_user_password=SecurePassword123"
# Or from vault: manual_user_password: "{{ vault_manual_user_password }}"

# Ansible User Configuration (uid 1999)
# USR-5: the automation account's name is configurable.
deploy_user_name: "ansible"
# USR-4: uid 1999 is fixed for the same reason uid 1000 is.
deploy_user_uid: 1999
# USR-10, USR-11: configurable path, resolved on the controller.
deploy_user_ssh_key_file: "~/.ssh/id_ed25519_ansible.pub"
# USR-7: login shell.
deploy_user_shell: "/bin/bash"
# USR-8: supplementary groups, appended.
deploy_user_groups: []
# USR-12: authorized_keys mode, re-asserted on every run.
authorized_keys_mode: "0600"

# Sudo hardening
# SUDO-7: how long a successful sudo authentication is cached before a new
# one is required, configurable.
sudo_timestamp_timeout: 5

# Login policy hardening
# LOGIN-5: shell idle timeout in seconds, configurable.
login_policy_tmout: 600
# LOGIN-7: default file-creation mask, hardened from Debian's implicit 022.
login_policy_umask: "027"
# LOGIN-8: console login retry limit, configurable; matches SSH's own
# MaxAuthTries by design.
login_policy_retries: 3
# LOGIN-9: console login timeout in seconds, configurable; matches SSH's
# own LoginGraceTime by design.
login_policy_timeout: 30

# PAM hardening — account lockout
pam_faillock_deny: 5
pam_faillock_unlock_time: 600
pam_faillock_fail_interval: 900

# PAM hardening — resource limits
pam_limits_nproc: 1024
pam_limits_nproc_root: 2048
pam_limits_nofile: 4096
pam_limits_nofile_root: 8192
