---
# Main tasks file for users role
# Creates manual access user and Ansible automation user with appropriate configurations

# Ensure sudo is installed (Debian cloud images may not include it)
- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
  tags:
    - users
    - sudo

# Manual Access User Creation (uid 1000)
# Requirements: 1.4
# (1.4 is the sudo grant below, owned by the sudo-hardening spec and not yet
# migrated. The rest of this block's citations now sit on their own tasks.)

# USR-1: uid 1000 is fixed — purpose repos address this account by number.
# USR-2: the name is configurable. USR-7: so is the login shell.
# USR-8: supplementary groups are appended, never replaced, so memberships
# granted by later tasks survive a re-run.
# USR-3: the password comes from a vault variable with no role default, and
# is written only at creation.
- name: Create manual access user with uid 1000
  ansible.builtin.user:
    name: "{{ manual_user_name }}"
    uid: "{{ manual_user_uid }}"
    shell: "{{ manual_user_shell }}"
    groups: "{{ manual_user_groups }}"
    append: true
    create_home: true
    password: "{{ manual_user_password }}"
    update_password: on_create
    state: present
  tags:
    - users
    - manual_user

# USR-9: sshd ignores authorized_keys under a directory others can write,
# and says nothing the locked-out operator can read.
- name: Ensure .ssh directory exists for manual user
  ansible.builtin.file:
    path: "/home/{{ manual_user_name }}/.ssh"
    state: directory
    owner: "{{ manual_user_name }}"
    group: "{{ manual_user_name }}"
    mode: "0700"
  tags:
    - users
    - manual_user

# USR-10: the key file path is configurable per account.
# USR-11: the lookup runs on the controller, which is what lets PRJ-7 check
# the same path before the run changes anything on the host.
- name: Deploy SSH public key to manual user authorized_keys
  ansible.posix.authorized_key:
    user: "{{ manual_user_name }}"
    key: "{{ lookup('file', manual_user_ssh_key_file) }}"
    state: present
    exclusive: false
  tags:
    - users
    - manual_user

# USR-12: re-asserted unconditionally, so a mode loosened by hand does not
# survive the next run.
- name: Set correct permissions on manual user authorized_keys
  ansible.builtin.file:
    path: "/home/{{ manual_user_name }}/.ssh/authorized_keys"
    owner: "{{ manual_user_name }}"
    group: "{{ manual_user_name }}"
    mode: "{{ authorized_keys_mode }}"
  tags:
    - users
    - manual_user

- name: Grant sudo privileges to manual user (password required)
  ansible.builtin.copy:
    content: "{{ manual_user_name }} ALL=(ALL:ALL) ALL\n"
    dest: "/etc/sudoers.d/{{ manual_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - manual_user
    - sudo

# Ansible User Creation (uid 1999)
# Requirements: 2.3, 2.4
# (2.3 is the passwordless sudo grant below, owned by the sudo-hardening
# spec; 2.4 is key-only authentication, which sshd enforces and the
# ssh-hardening spec owns. Neither is migrated yet.)

# USR-4: uid 1999 is fixed. USR-5: the name is configurable.
# USR-7: so is the login shell. USR-8: supplementary groups are appended.
# USR-6: "!" is a shadow field no password can hash to — an empty field
# would mean "no password required", not "no password".
- name: Create Ansible user with uid 1999
  ansible.builtin.user:
    name: "{{ deploy_user_name }}"
    uid: "{{ deploy_user_uid }}"
    shell: "{{ deploy_user_shell }}"
    groups: "{{ deploy_user_groups }}"
    append: true
    create_home: true
    password: "!"
    state: present
  tags:
    - users
    - ansible_user

# USR-9: same directory contract as the manual account's.
- name: Ensure .ssh directory exists for Ansible user
  ansible.builtin.file:
    path: "/home/{{ deploy_user_name }}/.ssh"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: "{{ deploy_user_name }}"
    mode: "0700"
  tags:
    - users
    - ansible_user

# USR-10, USR-11: as for the manual account — a configurable path, read on
# the controller.
- name: Deploy SSH public key to Ansible user authorized_keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user_name }}"
    key: "{{ lookup('file', deploy_user_ssh_key_file) }}"
    state: present
    exclusive: false
  tags:
    - users
    - ansible_user

# USR-12: same unconditional mode reassertion.
- name: Set correct permissions on Ansible user authorized_keys
  ansible.builtin.file:
    path: "/home/{{ deploy_user_name }}/.ssh/authorized_keys"
    owner: "{{ deploy_user_name }}"
    group: "{{ deploy_user_name }}"
    mode: "{{ authorized_keys_mode }}"
  tags:
    - users
    - ansible_user

- name: Grant passwordless sudo privileges to Ansible user
  ansible.builtin.copy:
    content: "{{ deploy_user_name }} ALL=(ALL:ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ deploy_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - ansible_user
    - sudo

# Sudo Hardening
# Harden sudo with environment sanitization, logging, timeouts, and su restriction

# USR-13: sshd admits only members of this group, so it has to exist before
# sshd is configured to consult it. The name's only definition lives in the
# ssh_hardening role's defaults; the fallback below has to match it.
- name: Create SSH access group
  ansible.builtin.group:
    name: "{{ ssh_access_group | default('ssh-users') }}"
    state: present
  tags:
    - users
    - ssh

# USR-14: this membership is what actually grants SSH access. append: true
# so it does not disturb memberships granted by other tasks.
- name: Add bootstrap users to SSH access group
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: "{{ ssh_access_group | default('ssh-users') }}"
    append: true
  loop:
    - "{{ manual_user_name }}"
    - "{{ deploy_user_name }}"
  loop_control:
    loop_var: user_name
  tags:
    - users
    - ssh

- name: Create wheel group for su restriction
  ansible.builtin.group:
    name: wheel
    state: present
  tags:
    - users
    - sudo

- name: Add manual user to wheel group
  ansible.builtin.user:
    name: "{{ manual_user_name }}"
    groups: wheel
    append: true
  tags:
    - users
    - manual_user
    - sudo

- name: Deploy sudo security defaults
  ansible.builtin.template:
    src: 00-sudo-security.j2
    dest: /etc/sudoers.d/00-sudo-security
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - sudo

- name: Restrict su to wheel group members
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*#?\s*auth\s+required\s+pam_wheel\.so'
    line: "auth       required   pam_wheel.so"
    state: present
  tags:
    - users
    - sudo

# Login Policy Hardening
# Harden login.defs, restrict console TTYs, enforce shell idle timeout

- name: Deploy hardened login.defs
  ansible.builtin.template:
    src: login.defs.j2
    dest: /etc/login.defs
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - login_policy

- name: Ensure pam_securetty is enabled for console login
  ansible.builtin.lineinfile:
    path: /etc/pam.d/login
    regexp: '^\s*#?\s*auth\s+requisite\s+pam_securetty\.so'
    line: "auth       requisite   pam_securetty.so"
    state: present
  tags:
    - users
    - login_policy

- name: Deploy securetty for console TTY restrictions
  ansible.builtin.template:
    src: securetty.j2
    dest: /etc/securetty
    owner: root
    group: root
    mode: "0600"
  tags:
    - users
    - login_policy

- name: Deploy shell idle timeout
  ansible.builtin.template:
    src: shell-timeout.sh.j2
    dest: /etc/profile.d/shell-timeout.sh
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - login_policy

# PAM Hardening
# Account lockout via pam_faillock, resource limits via pam_limits

- name: Deploy faillock configuration
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening

- name: Remove legacy faillock PAM profile
  ansible.builtin.file:
    path: /usr/share/pam-configs/faillock
    state: absent
  tags:
    - users
    - pam_hardening
  notify: Rebuild PAM common-auth

- name: Deploy faillock preauth PAM profile
  ansible.builtin.template:
    src: faillock-preauth-pam-config.j2
    dest: /usr/share/pam-configs/faillock-preauth
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
  notify: Rebuild PAM common-auth

- name: Deploy faillock authfail PAM profile
  ansible.builtin.template:
    src: faillock-authfail-pam-config.j2
    dest: /usr/share/pam-configs/faillock-authfail
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
  notify: Rebuild PAM common-auth

- name: Deploy resource limits
  ansible.builtin.template:
    src: 50-hardening.conf.j2
    dest: /etc/security/limits.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
