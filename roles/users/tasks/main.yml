---
# Main tasks file for users role
# Creates manual access user and Ansible automation user with appropriate configurations

# Ensure sudo is installed (Debian cloud images may not include it)
# SUDO-1: sudo has to be installed before anything else in this role can
# grant it or configure it.
- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
  tags:
    - users
    - sudo

# Manual Access User Creation (uid 1000)

# USR-1: uid 1000 is fixed — purpose repos address this account by number.
# USR-2: the name is configurable. USR-7: so is the login shell.
# USR-8: supplementary groups are appended, never replaced, so memberships
# granted by later tasks survive a re-run.
# USR-3: the password comes from a vault variable with no role default, and
# is written only at creation.
- name: Create manual access user with uid 1000
  ansible.builtin.user:
    name: "{{ manual_user_name }}"
    uid: "{{ manual_user_uid }}"
    shell: "{{ manual_user_shell }}"
    groups: "{{ manual_user_groups }}"
    append: true
    create_home: true
    password: "{{ manual_user_password }}"
    update_password: on_create
    state: present
  tags:
    - users
    - manual_user

# USR-9: sshd ignores authorized_keys under a directory others can write,
# and says nothing the locked-out operator can read.
- name: Ensure .ssh directory exists for manual user
  ansible.builtin.file:
    path: "/home/{{ manual_user_name }}/.ssh"
    state: directory
    owner: "{{ manual_user_name }}"
    group: "{{ manual_user_name }}"
    mode: "0700"
  tags:
    - users
    - manual_user

# USR-10: the key file path is configurable per account.
# USR-11: the lookup runs on the controller, which is what lets PRJ-7 check
# the same path before the run changes anything on the host.
- name: Deploy SSH public key to manual user authorized_keys
  ansible.posix.authorized_key:
    user: "{{ manual_user_name }}"
    key: "{{ lookup('file', manual_user_ssh_key_file) }}"
    state: present
    exclusive: false
  tags:
    - users
    - manual_user

# USR-12: re-asserted unconditionally, so a mode loosened by hand does not
# survive the next run.
- name: Set correct permissions on manual user authorized_keys
  ansible.builtin.file:
    path: "/home/{{ manual_user_name }}/.ssh/authorized_keys"
    owner: "{{ manual_user_name }}"
    group: "{{ manual_user_name }}"
    mode: "{{ authorized_keys_mode }}"
  tags:
    - users
    - manual_user

# SUDO-2: the manual account's own sudoers.d file, requiring a password;
# validated with visudo before being installed.
- name: Grant sudo privileges to manual user (password required)
  ansible.builtin.copy:
    content: "{{ manual_user_name }} ALL=(ALL:ALL) ALL\n"
    dest: "/etc/sudoers.d/{{ manual_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - manual_user
    - sudo

# Ansible User Creation (uid 1999)
# Requirements: 2.4
# (2.4 is key-only SSH authentication, enforced by sshd and owned by the
# ssh-hardening spec; not yet migrated.)

# USR-4: uid 1999 is fixed. USR-5: the name is configurable.
# USR-7: so is the login shell. USR-8: supplementary groups are appended.
# USR-6: "!" is a shadow field no password can hash to — an empty field
# would mean "no password required", not "no password".
- name: Create Ansible user with uid 1999
  ansible.builtin.user:
    name: "{{ deploy_user_name }}"
    uid: "{{ deploy_user_uid }}"
    shell: "{{ deploy_user_shell }}"
    groups: "{{ deploy_user_groups }}"
    append: true
    create_home: true
    password: "!"
    state: present
  tags:
    - users
    - ansible_user

# USR-9: same directory contract as the manual account's.
- name: Ensure .ssh directory exists for Ansible user
  ansible.builtin.file:
    path: "/home/{{ deploy_user_name }}/.ssh"
    state: directory
    owner: "{{ deploy_user_name }}"
    group: "{{ deploy_user_name }}"
    mode: "0700"
  tags:
    - users
    - ansible_user

# USR-10, USR-11: as for the manual account — a configurable path, read on
# the controller.
- name: Deploy SSH public key to Ansible user authorized_keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user_name }}"
    key: "{{ lookup('file', deploy_user_ssh_key_file) }}"
    state: present
    exclusive: false
  tags:
    - users
    - ansible_user

# USR-12: same unconditional mode reassertion.
- name: Set correct permissions on Ansible user authorized_keys
  ansible.builtin.file:
    path: "/home/{{ deploy_user_name }}/.ssh/authorized_keys"
    owner: "{{ deploy_user_name }}"
    group: "{{ deploy_user_name }}"
    mode: "{{ authorized_keys_mode }}"
  tags:
    - users
    - ansible_user

# SUDO-3: the automation account's own sudoers.d file, passwordless;
# validated with visudo before being installed.
- name: Grant passwordless sudo privileges to Ansible user
  ansible.builtin.copy:
    content: "{{ deploy_user_name }} ALL=(ALL:ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ deploy_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - ansible_user
    - sudo

# USR-13: sshd admits only members of this group, so it has to exist before
# sshd is configured to consult it. The name's only definition lives in the
# ssh_hardening role's defaults; the fallback below has to match it.
- name: Create SSH access group
  ansible.builtin.group:
    name: "{{ ssh_access_group | default('ssh-users') }}"
    state: present
  tags:
    - users
    - ssh

# USR-14: this membership is what actually grants SSH access. append: true
# so it does not disturb memberships granted by other tasks.
- name: Add bootstrap users to SSH access group
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: "{{ ssh_access_group | default('ssh-users') }}"
    append: true
  loop:
    - "{{ manual_user_name }}"
    - "{{ deploy_user_name }}"
  loop_control:
    loop_var: user_name
  tags:
    - users
    - ssh

# Sudo Hardening
# The shared sudo security defaults, the wheel group and su restriction. The
# per-account sudoers.d grants above are SUDO's too, cited where they sit.

# SUDO-11: wheel has to exist before anything can be restricted to its
# membership.
- name: Create wheel group for su restriction
  ansible.builtin.group:
    name: wheel
    state: present
  tags:
    - users
    - sudo

# SUDO-12: only the manual account joins wheel — the automation account
# escalates through its own passwordless sudo grant, not su.
- name: Add manual user to wheel group
  ansible.builtin.user:
    name: "{{ manual_user_name }}"
    groups: wheel
    append: true
  tags:
    - users
    - manual_user
    - sudo

# SUDO-4: the shared sudoers.d drop-in, validated with visudo like every
# sudoers.d file this role writes. Each directive it sets is cited in the
# template itself.
- name: Deploy sudo security defaults
  ansible.builtin.template:
    src: 00-sudo-security.j2
    dest: /etc/sudoers.d/00-sudo-security
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - sudo

# SUDO-13: su refuses non-wheel members via pam_wheel. With no group=
# option, pam_wheel checks membership of a group literally named wheel if
# one exists — which SUDO-11 guarantees — falling back to GID 0 only when
# it does not.
- name: Restrict su to wheel group members
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*#?\s*auth\s+required\s+pam_wheel\.so'
    line: "auth       required   pam_wheel.so"
    state: present
  tags:
    - users
    - sudo

# Login Policy Hardening
# Harden login.defs, restrict console TTYs, enforce shell idle timeout

# LOGIN-1: render the whole file from a template so every hardened setting
# is reviewed in one place, while everything else Debian shipped is left
# untouched.
- name: Deploy hardened login.defs
  ansible.builtin.template:
    src: login.defs.j2
    dest: /etc/login.defs
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - login_policy

# LOGIN-3: this is what makes /etc/securetty (LOGIN-4) actually enforced
# for root at the console; scoped to /etc/pam.d/login only, not sshd, su
# or sudo.
- name: Ensure pam_securetty is enabled for console login
  ansible.builtin.lineinfile:
    path: /etc/pam.d/login
    regexp: '^\s*#?\s*auth\s+requisite\s+pam_securetty\.so'
    line: "auth       requisite   pam_securetty.so"
    state: present
  tags:
    - users
    - login_policy

# LOGIN-4: the fixed TTY allow-list pam_securetty consults. No pts/ entry
# is present, which is what keeps a network-terminated session from ever
# presenting a tty this file accepts.
- name: Deploy securetty for console TTY restrictions
  ansible.builtin.template:
    src: securetty.j2
    dest: /etc/securetty
    owner: root
    group: root
    mode: "0600"
  tags:
    - users
    - login_policy

# LOGIN-5, LOGIN-6: a configurable, exported TMOUT marked readonly in the
# shell that sources it — advisory, not enforcement; see the login-policy
# design's Key decisions for what readonly does and does not cover.
- name: Deploy shell idle timeout
  ansible.builtin.template:
    src: shell-timeout.sh.j2
    dest: /etc/profile.d/shell-timeout.sh
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - login_policy

# PAM Hardening
# Account lockout via pam_faillock, resource limits via pam_limits

# PAM-1: renders the whole lockout policy from one template; the
# individual configurable directives are cited in the template itself,
# not here.
- name: Deploy faillock configuration
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening

# PAM-8: removes the pre-ec94b3d single-profile deployment that PAM-6 and
# PAM-7 superseded, so a host still carrying it self-heals on the next
# run. PAM-9: the notify below is what makes this removal, and both
# profile deployments after it, actually take effect in common-auth.
- name: Remove legacy faillock PAM profile
  ansible.builtin.file:
    path: /usr/share/pam-configs/faillock
    state: absent
  tags:
    - users
    - pam_hardening
  notify: Rebuild PAM common-auth

# PAM-6: priority 512, ahead of pam_unix's 256 (see
# /usr/share/pam-configs/unix) — checks whether the account is already
# locked out before pam_unix gets a chance to prompt for a password. The
# template itself carries no citation: it is a pam-auth-update source
# file with no comment syntax, and its deploying task carries a notify —
# see design.md's Approach for why the citation sits here instead.
- name: Deploy faillock preauth PAM profile
  ansible.builtin.template:
    src: faillock-preauth-pam-config.j2
    dest: /usr/share/pam-configs/faillock-preauth
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
  notify: Rebuild PAM common-auth

# PAM-7: priority 128, behind pam_unix's 256 — reacts to this attempt's
# own pass/fail result and denies past the configured limit. Running this
# ahead of pam_unix instead, as the single profile ec94b3d replaced did,
# is why deny= was never actually enforced; see design.md's Key
# decisions. PAM-17: this same profile's Account section separately
# resets the failure counter once an account authenticates successfully.
# Same no-citation-in-template constraint as the preauth profile above.
- name: Deploy faillock authfail PAM profile
  ansible.builtin.template:
    src: faillock-authfail-pam-config.j2
    dest: /usr/share/pam-configs/faillock-authfail
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
  notify: Rebuild PAM common-auth

# PAM-16: renders the whole resource-limits file from one template; the
# individual directives it sets are cited in the template itself, not
# here.
- name: Deploy resource limits
  ansible.builtin.template:
    src: 50-hardening.conf.j2
    dest: /etc/security/limits.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
