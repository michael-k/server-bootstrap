---
# Main tasks file for users role
# Creates manual access user and Ansible automation user with appropriate configurations

# Manual Access User Creation (uid 1000)
# Requirements: 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.8

- name: Create manual access user with uid 1000
  ansible.builtin.user:
    name: "{{ manual_user_name }}"
    uid: "{{ manual_user_uid }}"
    shell: "{{ manual_user_shell }}"
    groups: "{{ manual_user_groups }}"
    append: true
    create_home: true
    password: "{{ manual_user_password | password_hash('sha512') }}"
    update_password: on_create
    state: present
  tags:
    - users
    - manual_user

- name: Ensure .ssh directory exists for manual user
  ansible.builtin.file:
    path: "/home/{{ manual_user_name }}/.ssh"
    state: directory
    owner: "{{ manual_user_name }}"
    group: "{{ manual_user_name }}"
    mode: "0700"
  tags:
    - users
    - manual_user

- name: Deploy SSH public key to manual user authorized_keys
  ansible.posix.authorized_key:
    user: "{{ manual_user_name }}"
    key: "{{ lookup('file', manual_user_ssh_key_file) }}"
    state: present
    exclusive: false
  tags:
    - users
    - manual_user

- name: Set correct permissions on manual user authorized_keys
  ansible.builtin.file:
    path: "/home/{{ manual_user_name }}/.ssh/authorized_keys"
    owner: "{{ manual_user_name }}"
    group: "{{ manual_user_name }}"
    mode: "{{ authorized_keys_mode }}"
  tags:
    - users
    - manual_user

- name: Grant sudo privileges to manual user (password required)
  ansible.builtin.copy:
    content: "{{ manual_user_name }} ALL=(ALL:ALL) ALL\n"
    dest: "/etc/sudoers.d/{{ manual_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - manual_user
    - sudo

# Ansible User Creation (uid 1999)
# Requirements: 2.1, 2.2, 2.3, 2.4, 2.5, 2.7, 2.8

- name: Create Ansible user with uid 1999
  ansible.builtin.user:
    name: "{{ ansible_user_name }}"
    uid: "{{ ansible_user_uid }}"
    shell: "{{ ansible_user_shell }}"
    groups: "{{ ansible_user_groups }}"
    append: true
    create_home: true
    password: "!"
    state: present
  tags:
    - users
    - ansible_user

- name: Ensure .ssh directory exists for Ansible user
  ansible.builtin.file:
    path: "/home/{{ ansible_user_name }}/.ssh"
    state: directory
    owner: "{{ ansible_user_name }}"
    group: "{{ ansible_user_name }}"
    mode: "0700"
  tags:
    - users
    - ansible_user

- name: Deploy SSH public key to Ansible user authorized_keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user_name }}"
    key: "{{ lookup('file', ansible_user_ssh_key_file) }}"
    state: present
    exclusive: false
  tags:
    - users
    - ansible_user

- name: Set correct permissions on Ansible user authorized_keys
  ansible.builtin.file:
    path: "/home/{{ ansible_user_name }}/.ssh/authorized_keys"
    owner: "{{ ansible_user_name }}"
    group: "{{ ansible_user_name }}"
    mode: "{{ authorized_keys_mode }}"
  tags:
    - users
    - ansible_user

- name: Grant passwordless sudo privileges to Ansible user
  ansible.builtin.copy:
    content: "{{ ansible_user_name }} ALL=(ALL:ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ ansible_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - ansible_user
    - sudo

# Sudo Hardening
# Harden sudo with environment sanitization, logging, timeouts, and su restriction

- name: Create wheel group for su restriction
  ansible.builtin.group:
    name: wheel
    state: present
  tags:
    - users
    - sudo

- name: Add manual user to wheel group
  ansible.builtin.user:
    name: "{{ manual_user_name }}"
    groups: wheel
    append: true
  tags:
    - users
    - manual_user
    - sudo

- name: Deploy sudo security defaults
  ansible.builtin.template:
    src: 00-sudo-security.j2
    dest: /etc/sudoers.d/00-sudo-security
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - users
    - sudo

- name: Restrict su to wheel group members
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*#?\s*auth\s+required\s+pam_wheel\.so'
    line: "auth       required   pam_wheel.so"
    state: present
  tags:
    - users
    - sudo

# Login Policy Hardening
# Harden login.defs, restrict console TTYs, enforce shell idle timeout

- name: Deploy hardened login.defs
  ansible.builtin.template:
    src: login.defs.j2
    dest: /etc/login.defs
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - login_policy

- name: Ensure pam_securetty is enabled for console login
  ansible.builtin.lineinfile:
    path: /etc/pam.d/login
    regexp: '^\s*#?\s*auth\s+requisite\s+pam_securetty\.so'
    line: "auth       requisite   pam_securetty.so"
    state: present
  tags:
    - users
    - login_policy

- name: Deploy securetty for console TTY restrictions
  ansible.builtin.template:
    src: securetty.j2
    dest: /etc/securetty
    owner: root
    group: root
    mode: "0600"
  tags:
    - users
    - login_policy

- name: Deploy shell idle timeout
  ansible.builtin.template:
    src: shell-timeout.sh.j2
    dest: /etc/profile.d/shell-timeout.sh
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - login_policy

# PAM Hardening
# Account lockout via pam_faillock, resource limits via pam_limits

- name: Deploy faillock configuration
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening

- name: Deploy faillock PAM profile
  ansible.builtin.template:
    src: faillock-pam-config.j2
    dest: /usr/share/pam-configs/faillock
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
  notify: Enable faillock in PAM

- name: Deploy resource limits
  ansible.builtin.template:
    src: 50-hardening.conf.j2
    dest: /etc/security/limits.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - users
    - pam_hardening
