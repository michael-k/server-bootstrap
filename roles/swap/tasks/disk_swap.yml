---
# Disk swap configuration tasks
# SWAP-11, SWAP-12, SWAP-13, SWAP-14, SWAP-15, SWAP-16
#
# Creates a file-based swap space on disk. Each step after the first is
# conditioned on the previous one having changed, which is what makes the
# chain idempotent — and what means a run that finds /swapfile already there
# does nothing but re-assert its mode.

# SWAP-11: allocate the file at the configured size. The creates guard is
# what keeps a re-run from re-allocating it.
- name: Create swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ disk_swap_size }} /swapfile"
    creates: /swapfile
  register: swap_file_created

# SWAP-12: restrict the file to root. Unconditional by design — the mode is
# re-asserted on every run, not only on the run that created the file.
- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
    owner: root
    group: root

# SWAP-13: write swap metadata into the allocated file.
- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: swap_file_created.changed
  register: swap_formatted

# SWAP-14: hand the formatted file to the kernel as a swap area.
# SWAP-16: at the configured priority, which is below the zram device's.
- name: Enable swap file
  ansible.builtin.command:
    cmd: "swapon --priority {{ disk_swap_priority }} /swapfile"
  when: swap_formatted.changed

# SWAP-15: look for an existing entry first, so a re-run does not add a
# second one. The match is on the path alone.
- name: Check if swap file is already in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^/swapfile\\s+"
    state: absent
  check_mode: true
  register: fstab_check
  changed_when: false

# SWAP-15: record the swap file so the next boot activates it again.
# SWAP-16: the pri= option carries the priority across the reboot.
- name: Add swap file to fstab for persistence
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw,pri={{ disk_swap_priority }} 0 0"
    state: present
  when: fstab_check.found == 0
