---
# Zram swap configuration tasks
# SWAP-3, SWAP-4, SWAP-5, SWAP-6, SWAP-7, SWAP-8, SWAP-9
#
# Zram creates a compressed block device in RAM that can be used as swap space.
# Device creation, formatting and activation are all done by the zramswap
# service; the tasks here configure it and then read the outcome back from the
# kernel rather than assuming it.

# SWAP-3: install the package that provides the zramswap service.
- name: Install zram-tools package
  ansible.builtin.apt:
    name: zram-tools
    state: present
    update_cache: true
  register: zram_tools_installed

# SWAP-4, SWAP-5, SWAP-9: deploy the service's configuration, which carries
# the device size, the compression algorithm and the swap priority.
- name: Create zram configuration file
  ansible.builtin.template:
    src: zram.conf.j2
    dest: /etc/default/zramswap
    owner: root
    group: root
    mode: "0644"
  notify: Restart zramswap service

# SWAP-8: enable the service on boot — a zram device does not survive a
# reboot, so boot enablement is its only persistence.
# SWAP-7: starting the service is also what activates the device as swap.
- name: Enable zramswap service
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started

# SWAP-4: the service creates the device asynchronously, so wait for the
# device node rather than treating a started service as a created device.
- name: Wait for zram device to be created
  ansible.builtin.wait_for:
    path: /dev/zram0
    timeout: 10

# SWAP-7: confirm from the kernel that the device is an active swap area.
# SWAP-6: the role never runs mkswap itself — the service formats the device.
# A device carrying no swap metadata cannot appear here, so this check is the
# only evidence of formatting, and it cannot tell the two failures apart.
- name: Verify zram device is active as swap
  ansible.builtin.command: swapon --show --noheadings
  register: swap_status
  changed_when: false
  failed_when: "'/dev/zram0' not in swap_status.stdout"

# SWAP-5: read the algorithm the kernel is actually using back from the
# device. The active algorithm is shown in square brackets: [lz4]
- name: Get zram compression algorithm
  ansible.builtin.command: cat /sys/block/zram0/comp_algorithm
  register: zram_comp_algo
  changed_when: false

# SWAP-5: fail the run when the active algorithm is not lz4.
- name: Verify lz4 compression is configured
  ansible.builtin.assert:
    that:
      - "'[lz4]' in zram_comp_algo.stdout or 'lz4' in zram_comp_algo.stdout"
    fail_msg: "Zram compression algorithm is not lz4: {{ zram_comp_algo.stdout }}"
    success_msg: "Zram is using lz4 compression"
