---
# Default variables for swap role

# SWAP-1: zram swap is opt-in.
zram_enabled: false
# SWAP-2: percentage of RAM (e.g. "50%") or absolute size (e.g. "2G").
zram_size: "50%"

# SWAP-10: disk swap is opt-in; an empty size means no swap file.
disk_swap_size: ""

# SWAP-16: zram outranks disk swap, so the kernel reclaims to compressed RAM
# before it reaches for the disk.
# SWAP-9: the zram device's priority.
zram_swap_priority: 100
# The swap file's priority.
disk_swap_priority: 10
