---
# Filesystem Hardening Role - Main Tasks
#
# Hardens /tmp, /dev/shm, and /var/tmp with noexec, nosuid, nodev options
# to prevent execution of uploaded payloads from temporary directories.
#
# Mount strategy:
#   /tmp     - drop-in override if tmp.mount exists, bind-mount unit otherwise
#   /dev/shm - drop-in override on existing tmpfs mount
#   /var/tmp - bind-mount to /tmp (inherits restrictions)

# --- /tmp hardening ---

# Check if a base tmp.mount unit exists (systemd ships one for tmpfs /tmp)
- name: Check if tmp.mount unit exists
  ansible.builtin.command: systemctl cat tmp.mount
  register: tmp_mount_exists
  changed_when: false
  failed_when: false

# Strategy A: drop-in override when tmp.mount already exists
- name: Ensure /tmp drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tmp_mount_exists.rc == 0

- name: Deploy hardened /tmp mount drop-in override
  ansible.builtin.template:
    src: tmp.mount.conf.j2
    dest: /etc/systemd/system/tmp.mount.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
  when: tmp_mount_exists.rc == 0
  notify: Reload systemd daemon
  register: tmp_dropin

# Strategy B: deploy full bind-mount unit when no tmp.mount exists
- name: Deploy hardened /tmp bind-mount unit
  ansible.builtin.template:
    src: tmp.mount.j2
    dest: /etc/systemd/system/tmp.mount
    owner: root
    group: root
    mode: "0644"
  when: tmp_mount_exists.rc != 0
  notify: Reload systemd daemon

# --- /dev/shm hardening ---

- name: Ensure /dev/shm drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/dev-shm.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy hardened /dev/shm mount override
  ansible.builtin.template:
    src: dev-shm.mount.conf.j2
    dest: /etc/systemd/system/dev-shm.mount.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
  register: shm_override

# --- /var/tmp hardening ---

- name: Deploy hardened /var/tmp mount unit
  ansible.builtin.template:
    src: var-tmp.mount.j2
    dest: /etc/systemd/system/var-tmp.mount
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

# Flush handlers to ensure daemon-reload runs before enabling/restarting mounts
- name: Flush handlers to reload systemd if unit files changed
  ansible.builtin.meta: flush_handlers

# --- Activate mounts ---

- name: Enable and start hardened /tmp mount
  ansible.builtin.systemd:
    name: tmp.mount
    enabled: true
    state: started

# Remount /tmp to pick up drop-in override if it changed.
# Uses remount (not restart) to preserve /tmp contents — restarting a
# tmpfs mount wipes it, which destroys Ansible's in-flight module payloads.
- name: Remount /tmp to apply drop-in override
  ansible.builtin.command: mount -o remount /tmp
  when: tmp_dropin is defined and tmp_dropin.changed
  changed_when: true

- name: Remount /dev/shm with hardened options
  ansible.builtin.command: mount -o remount /dev/shm
  when: shm_override.changed
  changed_when: true

- name: Enable and start hardened /var/tmp mount
  ansible.builtin.systemd:
    name: var-tmp.mount
    enabled: true
    state: started
