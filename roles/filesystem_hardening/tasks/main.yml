---
# Filesystem Hardening Role - Main Tasks
#
# FS-1, FS-2, FS-3: mounts /tmp, /var/tmp and /dev/shm with noexec, nosuid,
# nodev, preventing execution of a payload written to any of them.
# FS-4: delivered as systemd mount units and drop-in overrides, never as
# /etc/fstab entries.
#
# Mount strategy:
#   /tmp     - drop-in override if tmp.mount exists, bind-mount unit otherwise
#   /dev/shm - drop-in override on existing tmpfs mount
#   /var/tmp - bind-mount to /tmp (inherits restrictions)

# --- /tmp hardening ---

# FS-1: the two mutually exclusive strategies for /tmp — a base tmp.mount
# unit already existing selects the drop-in override below; its absence
# selects the full bind-mount unit.
# Check if a base tmp.mount unit exists (systemd ships one for tmpfs /tmp)
- name: Check if tmp.mount unit exists
  ansible.builtin.command: systemctl cat tmp.mount
  register: tmp_mount_exists
  changed_when: false
  failed_when: false

# Strategy A: drop-in override when tmp.mount already exists
- name: Ensure /tmp drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tmp_mount_exists.rc == 0

- name: Deploy hardened /tmp mount drop-in override
  ansible.builtin.template:
    src: tmp.mount.conf.j2
    dest: /etc/systemd/system/tmp.mount.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
  when: tmp_mount_exists.rc == 0
  notify: Reload systemd daemon  # FS-1, FS-4
  register: tmp_dropin

# Strategy B: deploy full bind-mount unit when no tmp.mount exists
- name: Deploy hardened /tmp bind-mount unit
  ansible.builtin.template:
    src: tmp.mount.j2
    dest: /etc/systemd/system/tmp.mount
    owner: root
    group: root
    mode: "0644"
  when: tmp_mount_exists.rc != 0
  notify: Reload systemd daemon  # FS-1, FS-4

# --- /dev/shm hardening ---

- name: Ensure /dev/shm drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/dev-shm.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# FS-3: /dev/shm mounted with noexec,nosuid,nodev via a drop-in override.
- name: Deploy hardened /dev/shm mount override
  ansible.builtin.template:
    src: dev-shm.mount.conf.j2
    dest: /etc/systemd/system/dev-shm.mount.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon  # FS-3, FS-4
  register: shm_override

# --- /var/tmp hardening ---

# FS-2: /var/tmp mounted with noexec,nosuid,nodev, bound onto /tmp.
- name: Deploy hardened /var/tmp mount unit
  ansible.builtin.template:
    src: var-tmp.mount.j2
    dest: /etc/systemd/system/var-tmp.mount
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon  # FS-2, FS-4

# Flush handlers to ensure daemon-reload runs before enabling/restarting mounts
- name: Flush handlers to reload systemd if unit files changed
  ansible.builtin.meta: flush_handlers

# --- Activate mounts ---

- name: Enable and start hardened /tmp mount
  ansible.builtin.systemd:
    name: tmp.mount
    enabled: true
    state: started

# FS-5: remount (not restart) to apply the drop-in immediately, in the same
# run, rather than waiting for the next boot. Uses remount rather than
# restart to preserve /tmp contents — restarting a tmpfs mount wipes it,
# which destroys Ansible's in-flight module payloads.
- name: Remount /tmp to apply drop-in override
  ansible.builtin.command: mount -o remount,noexec,nosuid,nodev /tmp
  when: tmp_dropin is defined and tmp_dropin.changed
  changed_when: true

# FS-5: remount /dev/shm immediately when its drop-in changed.
- name: Remount /dev/shm with hardened options
  ansible.builtin.command: mount -o remount,noexec,nosuid,nodev /dev/shm
  when: shm_override.changed
  changed_when: true

# FS-6: unlike /tmp and /dev/shm above, an already-active var-tmp.mount is
# not remounted or restarted here when its unit file changes — see FS-6's
# Traceability note.
- name: Enable and start hardened /var/tmp mount
  ansible.builtin.systemd:
    name: var-tmp.mount
    enabled: true
    state: started
