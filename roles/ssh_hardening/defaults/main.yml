---
# SSH Hardening Role - Default Variables

# SSH-13: the port sshd listens on
ssh_port: 22

# SSH-14, SSH-15, SSH-16: session limits
ssh_max_auth_tries: 3
ssh_login_grace_time: "30s"
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2

# SSH-5: key exchange algorithms. The client's order decides which one a
# session uses, so what this list controls is which algorithms are allowed.
ssh_kex_algorithms:
  - sntrup761x25519-sha512
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512

# SSH-6: ciphers
ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com

# SSH-7: MAC algorithms
ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com

# SSH-12: the group whose members may log in over SSH. The group itself is
# created and populated by the users role; this is only the name sshd is
# told to admit.
ssh_access_group: "ssh-users"

# SSH-18: the addresses sshd binds to when Tailscale is not enrolled. When
# it is, the template binds tailscale_ipv4 and tailscale_ipv6 instead.
ssh_listen_address_ipv4: "0.0.0.0"
ssh_listen_address_ipv6: "::"
