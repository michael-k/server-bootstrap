---
# SSH Hardening Role - Tasks

# Deploy hardened SSH daemon configuration (Requirements 3.1-3.18)
- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    backup: true
  notify: Restart sshd
