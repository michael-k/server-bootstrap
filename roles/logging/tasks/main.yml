---
# Logging Role - Main Tasks
# LOG-1, LOG-2, LOG-3, LOG-4, LOG-5
#
# Configures journald for persistent logging with configurable retention settings.
# Journald is the systemd logging service that collects logs from all system services.

# LOG-1: persist logs to disk. LOG-2: cap disk usage. LOG-3: cap retention.
# LOG-4: notify the restart handler so a changed configuration takes effect
# within this run.
- name: Deploy journald configuration
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

# LOG-5: /var/log/journal is where journald actually writes persistent
# entries; owner/group/mode are re-asserted unconditionally on every run so
# they cannot drift more permissive than this leaves them.
- name: Ensure journald configuration directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

# LOG-4: flush immediately so the restart happens within this run rather
# than waiting for the play to end or the host's next reboot.
- name: Flush handlers to restart journald if configuration changed
  ansible.builtin.meta: flush_handlers
