---
# Default variables for system_updates role
# These can be overridden in inventory or playbook variables

# APT update and upgrade configuration
apt_update_cache_valid_time: 3600 # UPD-1: cache validity in seconds (1 hour)
apt_upgrade_type: "dist" # UPD-2: options are dist, full, safe, yes — see design.md Key decisions for why dist
apt_autoremove: true # UPD-3: remove unused dependencies after upgrade
apt_autoclean: true # UPD-4: clean up package cache after upgrade
