---
# Default variables for tailscale role
# These can be overridden in inventory or playbook variables

# Tailscale Enable Flag (Requirement 4.1, 4.2, 4.3)
# Set to true to install and configure Tailscale VPN
# Set to false to skip all Tailscale installation and configuration
tailscale_enabled: false

# Tailscale Control Server URL (Requirement 4.3)
# URL of the Headscale control server
# Example: "https://headscale.example.com"
tailscale_control_server: ""

# Tailscale Pre-Authentication Key (Requirement 4.2)
# Pre-auth key for automatic node registration with the control server
# Should be provided from Ansible Vault for security
# Example: tailscale_pre_auth_key: "{{ vault_tailscale_pre_auth_key }}"
tailscale_pre_auth_key: ""

# Tailscale Interface Name
# The network interface created by Tailscale
tailscale_interface: "tailscale0"

# Tailscale Package Repository
# Official Tailscale package repository for Debian
tailscale_repo_url: "https://pkgs.tailscale.com/stable/debian"
tailscale_repo_key_url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
