---
# Default variables for tailscale role
# These can be overridden in inventory or playbook variables

# TS-1: enrolment is opt-in. False means this role does nothing at all —
# no package, no registration, no verification, no facts.
tailscale_enabled: false

# TS-6: URL of the Headscale control server this node registers with.
# There is no sensible default, so the empty value is deliberate: the
# playbook's own pre-flight check refuses an enabled run without one.
# Example: "https://headscale.example.com"
tailscale_control_server: ""

# TS-7: pre-authentication key for unattended node registration, supplied
# from Ansible Vault and never committed here.
# Example: tailscale_pre_auth_key: "{{ vault_tailscale_pre_auth_key }}"
tailscale_pre_auth_key: ""

# TS-14: the interface the client creates, named once here because every
# verification check and every downstream firewall rule refers to it.
tailscale_interface: "tailscale0"

# TS-3: the official package repository the client is installed from.
tailscale_repo_url: "https://pkgs.tailscale.com/stable/debian"
# TS-4: the signing key the repository is pinned to.
# TS-5: both the suite and the key file follow the host's own Debian release.
tailscale_repo_key_url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
