---
# Tailscale connectivity verification.
# Everything here runs before the role returns, so a tailnet that did not
# come up fails the run while the host is still reachable the way it was.

# TS-15: the interface has to appear at all. The wait tolerates its own
# timeout so the failure below can name lockout as the reason.
- name: Wait for Tailscale interface to be created
  ansible.builtin.wait_for:
    path: /sys/class/net/{{ tailscale_interface }}
    timeout: 30
  register: tailscale_interface_wait
  failed_when: false
  tags:
    - tailscale
    - verification

# TS-15: the failure itself.
- name: Fail if Tailscale interface does not exist
  ansible.builtin.fail:
    msg: >
      Tailscale interface {{ tailscale_interface }} does not exist after 30 seconds.
      Tailscale may not be properly configured or connected.
      Cannot proceed with SSH restriction to prevent lockout.
  when: tailscale_interface_wait.failed | default(false)
  tags:
    - tailscale
    - verification

# TS-16: an interface can exist while the client is still negotiating or
# logged out, so the backend's own state is what the address lookups wait on.
- name: Wait for Tailscale to reach Running state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  retries: 15
  delay: 2
  until: (tailscale_status.stdout | from_json).BackendState == "Running"
  tags:
    - tailscale
    - verification

# TS-16: the parsed status, reported by the final task of this file.
- name: Parse Tailscale status
  ansible.builtin.set_fact:
    tailscale_status_json: "{{ tailscale_status.stdout | from_json }}"
  tags:
    - tailscale
    - verification

# TS-17: the IPv4 address downstream roles bind and filter on.
- name: Get Tailscale IPv4 address
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  tags:
    - tailscale
    - verification

# TS-18: the IPv6 half of the same pair.
- name: Get Tailscale IPv6 address
  ansible.builtin.command:
    cmd: tailscale ip -6
  register: tailscale_ip6
  changed_when: false
  tags:
    - tailscale
    - verification

# TS-17, TS-18: this role's output. Every consumer reads these two facts
# rather than querying the client itself.
- name: Set Tailscale IP facts
  ansible.builtin.set_fact:
    tailscale_ipv4: "{{ tailscale_ip.stdout | trim }}"
    tailscale_ipv6: "{{ tailscale_ip6.stdout | trim }}"
  tags:
    - tailscale
    - verification

# TS-19: an empty fact renders as an empty ListenAddress downstream, which
# sshd's own validation rejects later with an error that does not name the
# cause, so it is refused here instead.
- name: Fail if Tailscale IPv4 is not assigned
  ansible.builtin.fail:
    msg: >
      Tailscale interface {{ tailscale_interface }} does not have an IPv4 address assigned.
      Cannot proceed with SSH restriction to prevent lockout.
      Please verify Tailscale configuration and network connectivity.
  when: tailscale_ipv4 == ""
  tags:
    - tailscale
    - verification

# TS-20: the same refusal for the IPv6 half.
- name: Fail if Tailscale IPv6 is not assigned
  ansible.builtin.fail:
    msg: >
      Tailscale interface {{ tailscale_interface }} does not have an IPv6 address assigned.
      Cannot proceed with SSH restriction to prevent lockout.
  when: tailscale_ipv6 == ""
  tags:
    - tailscale
    - verification

# TS-21: the last check before the narrowing that follows. Note what it
# actually measures: the target is this host's own tailnet address, which
# the kernel answers locally, so a pass does not establish that any packet
# crossed the tailnet. See specs/tailscale/design.md.
- name: Test connectivity through Tailscale interface
  ansible.builtin.command:
    cmd: ping -c 3 -I {{ tailscale_interface }} {{ tailscale_ipv4 }}
  register: tailscale_ping
  changed_when: false
  failed_when: false
  tags:
    - tailscale
    - verification

# TS-21: the measured result is acted on, not merely reported.
- name: Fail if Tailscale connectivity test fails
  ansible.builtin.fail:
    msg: >
      Connectivity test through Tailscale interface {{ tailscale_interface }} failed.
      Cannot proceed with SSH restriction to prevent lockout.
      Please verify Tailscale network configuration and routing.
      Ping output: {{ tailscale_ping.stdout }}
  when: tailscale_ping.rc != 0
  tags:
    - tailscale
    - verification

# TS-21: what was verified, for the run's operator.
- name: Display Tailscale connectivity verification success
  ansible.builtin.debug:
    msg: >
      Tailscale connectivity verified successfully.
      Interface: {{ tailscale_interface }}
      IPv4 Address: {{ tailscale_ipv4 }}
      Backend State: {{ tailscale_status_json.BackendState }}
      SSH can now be safely restricted to Tailscale interface.
  tags:
    - tailscale
    - verification
