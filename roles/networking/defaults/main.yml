---
# Default variables for networking role

# static_ipv6_address (optional)
# NET-1: empty disables this role entirely.
# NET-2: when set, combined with DHCPv4 in netplan.
# NET-4: must include the prefix length, e.g. "2a01:239:4b2:1c00::1/128"
static_ipv6_address: ""

# static_ipv6_gateway
# NET-3: defaults to fe80::1 (IONOS); override for other providers.
static_ipv6_gateway: "fe80::1"
