---
# Verification Playbook for VPS Bootstrap Configuration
# This playbook implements the 44 verification tasks from Requirement 14
# to ensure the bootstrap playbook has correctly configured the VPS.
#
# Usage:
#   make verify
#   OR
#   uv run ansible-playbook -i inventory tests/verify_bootstrap.yml
#
# Exit codes:
#   0 - All tests passed
#   Non-zero - One or more tests failed

- name: Verify VPS Bootstrap Configuration
  hosts: all
  become: true
  gather_facts: true
  vars:
    verification_results: []
    tests_passed: 0
    tests_failed: 0
    tests_skipped: 0

  tasks:
    # This play declares no `roles:`, so roles/*/defaults/main.yml is not in scope.
    # Load the defaults this playbook asserts against under their own namespace, so
    # they stay a fallback for `| default(...)` rather than overriding an inventory
    # that sets them - include_vars outranks inventory variables.
    - name: Load users role defaults as fallbacks for login policy assertions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/users/defaults/main.yml"
        name: users_role_defaults
      tags: ["always"]

    # ==============================================================================
    # USER ACCOUNT VERIFICATION (Requirements 14.1-14.4)
    # ==============================================================================

    - name: "Test 14.1: Verify manual access user exists with uid 1000"
      block:
        - name: Get manual user information
          ansible.builtin.command: "getent passwd {{ manual_user_name }}"
          register: manual_user_info
          changed_when: false
          failed_when: false

        - name: Check manual user UID
          ansible.builtin.assert:
            that:
              - manual_user_info.rc == 0
              - manual_user_info.stdout is search(':1000:')
            fail_msg: "Manual user {{ manual_user_name }} does not exist with uid 1000"
            success_msg: "✓ Manual user {{ manual_user_name }} exists with uid 1000"

    - name: "Test 14.2: Verify Ansible user exists with uid 1999"
      block:
        - name: Get Ansible user information
          ansible.builtin.command: "getent passwd {{ deploy_user_name }}"
          register: ansible_user_info
          changed_when: false
          failed_when: false

        - name: Check Ansible user UID
          ansible.builtin.assert:
            that:
              - ansible_user_info.rc == 0
              - ansible_user_info.stdout is search(':1999:')
            fail_msg: "Ansible user {{ deploy_user_name }} does not exist with uid 1999"
            success_msg: "✓ Ansible user {{ deploy_user_name }} exists with uid 1999"

    - name: "Test 14.3: Verify manual access user has sudo privileges"
      block:
        - name: Check manual user sudo configuration
          ansible.builtin.stat:
            path: "/etc/sudoers.d/{{ manual_user_name }}"
          register: manual_sudo_file

        - name: Read manual user sudo configuration
          ansible.builtin.slurp:
            path: "/etc/sudoers.d/{{ manual_user_name }}"
          register: manual_sudo_content
          when: manual_sudo_file.stat.exists

        - name: Verify manual user sudo privileges
          ansible.builtin.assert:
            that:
              - manual_sudo_file.stat.exists
              - manual_sudo_content.content | b64decode is search(manual_user_name)
              - manual_sudo_content.content | b64decode is search('ALL=\\(ALL:ALL\\) ALL')
            fail_msg: "Manual user {{ manual_user_name }} does not have proper sudo privileges"
            success_msg: "✓ Manual user {{ manual_user_name }} has sudo privileges"

    - name: "Test 14.4: Verify Ansible user has passwordless sudo privileges"
      block:
        - name: Check Ansible user sudo configuration
          ansible.builtin.stat:
            path: "/etc/sudoers.d/{{ deploy_user_name }}"
          register: ansible_sudo_file

        - name: Read Ansible user sudo configuration
          ansible.builtin.slurp:
            path: "/etc/sudoers.d/{{ deploy_user_name }}"
          register: ansible_sudo_content
          when: ansible_sudo_file.stat.exists

        - name: Verify Ansible user passwordless sudo
          ansible.builtin.assert:
            that:
              - ansible_sudo_file.stat.exists
              - ansible_sudo_content.content | b64decode is search(deploy_user_name)
              - ansible_sudo_content.content | b64decode is search('NOPASSWD')
            fail_msg: "Ansible user {{ deploy_user_name }} does not have passwordless sudo"
            success_msg: "✓ Ansible user {{ deploy_user_name }} has passwordless sudo"

    # ==============================================================================
    # SUDO HARDENING VERIFICATION
    # ==============================================================================

    - name: "Verify sudo security defaults are deployed"
      block:
        - name: Check sudo security defaults file exists
          ansible.builtin.stat:
            path: /etc/sudoers.d/00-sudo-security
          register: sudo_security_file

        - name: Read sudo security defaults
          ansible.builtin.slurp:
            path: /etc/sudoers.d/00-sudo-security
          register: sudo_security_content
          when: sudo_security_file.stat.exists

        - name: Verify sudo security directives
          ansible.builtin.assert:
            that:
              - sudo_security_file.stat.exists
              - sudo_security_content.content | b64decode is search('env_reset')
              - sudo_security_content.content | b64decode is search('secure_path')
              - sudo_security_content.content | b64decode is search('use_pty')
              - sudo_security_content.content | b64decode is search('requiretty')
            fail_msg: "Sudo security defaults are missing or incomplete"
            success_msg: "✓ Sudo security defaults are properly configured"

    - name: "Verify wheel group and su restriction"
      block:
        - name: Check wheel group exists
          ansible.builtin.command: getent group wheel
          register: wheel_group
          changed_when: false

        - name: Check manual user is in wheel group
          ansible.builtin.command: "id -nG {{ manual_user_name }}"
          register: manual_user_groups_check
          changed_when: false

        - name: Check pam_wheel is enabled
          ansible.builtin.command: grep -E '^\s*auth\s+required\s+pam_wheel\.so' /etc/pam.d/su
          register: pam_wheel_check
          changed_when: false

        - name: Verify wheel group and su restriction
          ansible.builtin.assert:
            that:
              - wheel_group.rc == 0
              - "'wheel' in manual_user_groups_check.stdout"
              - pam_wheel_check.rc == 0
            fail_msg: "Wheel group or su restriction is not properly configured"
            success_msg: "✓ Wheel group exists, manual user is a member, su restricted to wheel"

    # ==============================================================================
    # SSH CONFIGURATION VERIFICATION (Requirements 14.5-14.17)
    # ==============================================================================

    - name: "Test 14.5: Verify SSHD password authentication is disabled"
      block:
        - name: Check SSHD password authentication setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify password authentication disabled
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('passwordauthentication no')
            fail_msg: "SSHD password authentication is not disabled"
            success_msg: "✓ SSHD password authentication is disabled"

    - name: "Test 14.6: Verify SSHD root login is disabled"
      block:
        - name: Check SSHD root login setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify root login disabled
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('permitrootlogin no')
            fail_msg: "SSHD root login is not disabled"
            success_msg: "✓ SSHD root login is disabled"

    - name: "Test 14.7: Verify SSHD is listening on configured port only"
      block:
        - name: Check SSHD port setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify SSH port configuration
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('port ' + (ssh_port | string))
            fail_msg: "SSHD is not listening on port {{ ssh_port }}"
            success_msg: "✓ SSHD is listening on port {{ ssh_port }}"

    - name: "Test 14.8: Verify SSHD AllowGroups is restricted"
      block:
        - name: Check SSHD AllowGroups setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify AllowGroups restriction
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('allowgroups')
              - sshd_config.stdout is search(ssh_access_group | default('ssh-users'))
            fail_msg: "SSHD AllowGroups is not properly restricted"
            success_msg: "✓ SSHD AllowGroups is restricted to {{ ssh_access_group | default('ssh-users') }}"

    - name: "Test 14.9: Verify SSHD key exchange algorithms"
      block:
        - name: Check SSHD KexAlgorithms setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify modern key exchange algorithms
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('kexalgorithms')
              - sshd_config.stdout is search('curve25519-sha256')
            fail_msg: "SSHD key exchange algorithms are not properly configured"
            success_msg: "✓ SSHD key exchange algorithms are hardened"

    - name: "Test 14.10: Verify SSHD ciphers"
      block:
        - name: Check SSHD Ciphers setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify AEAD ciphers
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('ciphers')
              - sshd_config.stdout is search('chacha20-poly1305@openssh.com') or sshd_config.stdout is search('aes256-gcm@openssh.com')
            fail_msg: "SSHD ciphers are not properly configured"
            success_msg: "✓ SSHD ciphers are hardened"

    - name: "Test 14.11: Verify SSHD MACs"
      block:
        - name: Check SSHD MACs setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify Encrypt-Then-MAC variants
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('macs')
              - sshd_config.stdout is search('etm@openssh.com')
            fail_msg: "SSHD MACs are not properly configured"
            success_msg: "✓ SSHD MACs are hardened"

    - name: "Test 14.12: Verify X11 forwarding is disabled"
      block:
        - name: Check SSHD X11Forwarding setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify X11 forwarding disabled
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('x11forwarding no')
            fail_msg: "SSHD X11 forwarding is not disabled"
            success_msg: "✓ SSHD X11 forwarding is disabled"

    - name: "Test 14.13: Verify TCP forwarding is disabled"
      block:
        - name: Check SSHD AllowTcpForwarding setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify TCP forwarding disabled
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('allowtcpforwarding no')
            fail_msg: "SSHD TCP forwarding is not disabled"
            success_msg: "✓ SSHD TCP forwarding is disabled"

    - name: "Test 14.14: Verify agent forwarding is disabled"
      block:
        - name: Check SSHD AllowAgentForwarding setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify agent forwarding disabled
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('allowagentforwarding no')
            fail_msg: "SSHD agent forwarding is not disabled"
            success_msg: "✓ SSHD agent forwarding is disabled"

    - name: "Test 14.15: Verify tunneling is disabled"
      block:
        - name: Check SSHD PermitTunnel setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Verify tunneling disabled
          ansible.builtin.assert:
            that:
              - sshd_config.stdout is search('permittunnel no')
            fail_msg: "SSHD tunneling is not disabled"
            success_msg: "✓ SSHD tunneling is disabled"

    - name: "Test 14.16: Verify SSHD service is running"
      block:
        - name: Check SSHD service status
          ansible.builtin.systemd:
            name: sshd
          register: sshd_service
          failed_when: false

        - name: Verify SSHD is active
          ansible.builtin.assert:
            that:
              - sshd_service.status.ActiveState == 'active'
            fail_msg: "SSHD service is not running"
            success_msg: "✓ SSHD service is running"

    - name: "Test 14.17: Verify SSHD service is enabled"
      block:
        - name: Check SSHD service enablement
          ansible.builtin.systemd:
            name: sshd
          register: sshd_service

        - name: Verify SSHD is enabled
          ansible.builtin.assert:
            that:
              - sshd_service.status.UnitFileState == 'enabled'
            fail_msg: "SSHD service is not enabled"
            success_msg: "✓ SSHD service is enabled"

    # ==============================================================================
    # TAILSCALE VERIFICATION (Requirements 14.18-14.21)
    # ==============================================================================

    - name: "Test 14.18: Verify Tailscale service is running"
      when: tailscale_enabled | default(false)
      block:
        - name: Check Tailscale service status
          ansible.builtin.systemd:
            name: tailscaled
          register: tailscale_service
          failed_when: false

        - name: Verify Tailscale is active
          ansible.builtin.assert:
            that:
              - tailscale_service.status.ActiveState == 'active'
            fail_msg: "Tailscale service is not running"
            success_msg: "✓ Tailscale service is running"

    - name: "Test 14.19: Verify Tailscale service is enabled"
      when: tailscale_enabled | default(false)
      block:
        - name: Check Tailscale service enablement
          ansible.builtin.systemd:
            name: tailscaled
          register: tailscale_service

        - name: Verify Tailscale is enabled
          ansible.builtin.assert:
            that:
              - tailscale_service.status.UnitFileState == 'enabled'
            fail_msg: "Tailscale service is not enabled"
            success_msg: "✓ Tailscale service is enabled"

    - name: "Test 14.20: Verify SSH is restricted to Tailscale interface"
      when: tailscale_enabled | default(false)
      block:
        - name: Check SSHD ListenAddress setting
          ansible.builtin.command: sshd -T
          register: sshd_config
          changed_when: false

        - name: Get Tailscale IP address
          ansible.builtin.command: "ip -4 addr show {{ tailscale_interface | default('tailscale0') }}"
          register: tailscale_ip
          changed_when: false
          failed_when: false

        - name: Verify SSH restricted to Tailscale
          ansible.builtin.assert:
            that:
              - tailscale_ip.rc == 0
              - sshd_config.stdout is search('listenaddress')
              - not (sshd_config.stdout is search('listenaddress 0.0.0.0'))
            fail_msg: "SSH is not restricted to Tailscale interface"
            success_msg: "✓ SSH is restricted to Tailscale interface"

    - name: "Test 14.21: Verify emergency script exists"
      when: tailscale_enabled | default(false)
      block:
        - name: Check emergency script file
          ansible.builtin.stat:
            path: /root/emergency-ssh-access.sh
          register: emergency_script

        - name: Verify emergency script exists and is executable
          ansible.builtin.assert:
            that:
              - emergency_script.stat.exists
              - emergency_script.stat.executable
            fail_msg: "Emergency script does not exist or is not executable"
            success_msg: "✓ Emergency script exists at /root/emergency-ssh-access.sh"

    # ==============================================================================
    # NFTABLES FIREWALL VERIFICATION (Requirements 14.22-14.28)
    # ==============================================================================

    - name: "Test 14.22: Verify NFTables service is active"
      block:
        - name: Check NFTables service status
          ansible.builtin.systemd:
            name: nftables
          register: nftables_service

        - name: Verify NFTables is active
          ansible.builtin.assert:
            that:
              - nftables_service.status.ActiveState == 'active'
            fail_msg: "NFTables service is not active"
            success_msg: "✓ NFTables service is active"

    - name: "Test 14.23: Verify NFTables service is enabled"
      block:
        - name: Check NFTables service enablement
          ansible.builtin.systemd:
            name: nftables
          register: nftables_service

        - name: Verify NFTables is enabled
          ansible.builtin.assert:
            that:
              - nftables_service.status.UnitFileState == 'enabled'
            fail_msg: "NFTables service is not enabled"
            success_msg: "✓ NFTables service is enabled"

    - name: "Test 14.24: Verify NFTables default input policy is drop"
      block:
        - name: Get NFTables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_rules
          changed_when: false

        - name: Verify input policy drop
          ansible.builtin.assert:
            that:
              - nft_rules.stdout is search('type filter hook input.*policy drop')
            fail_msg: "NFTables input policy is not drop"
            success_msg: "✓ NFTables input policy is drop"

    - name: "Test 14.25: Verify NFTables default forward policy is drop"
      block:
        - name: Get NFTables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_rules
          changed_when: false

        - name: Verify forward policy drop
          ansible.builtin.assert:
            that:
              - nft_rules.stdout is search('type filter hook forward.*policy drop')
            fail_msg: "NFTables forward policy is not drop"
            success_msg: "✓ NFTables forward policy is drop"

    - name: "Test 14.26: Verify NFTables allows established/related connections"
      block:
        - name: Get NFTables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_rules
          changed_when: false

        - name: Verify stateful rules
          ansible.builtin.assert:
            that:
              - nft_rules.stdout is search('ct state.*established.*related.*accept')
            fail_msg: "NFTables does not allow established/related connections"
            success_msg: "✓ NFTables allows established/related connections"

    - name: "Test 14.27: Verify NFTables allows loopback traffic"
      block:
        - name: Get NFTables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_rules
          changed_when: false

        - name: Verify loopback rules
          ansible.builtin.assert:
            that:
              - nft_rules.stdout is search('iif.*lo.*accept') or nft_rules.stdout is search('iifname.*lo.*accept')
            fail_msg: "NFTables does not allow loopback traffic"
            success_msg: "✓ NFTables allows loopback traffic"

    - name: "Test 14.28: Verify SSH port is accessible through firewall"
      block:
        - name: Get NFTables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_rules
          changed_when: false

        - name: Verify SSH port rules
          ansible.builtin.assert:
            that:
              - nft_rules.stdout is search('tcp dport ' + (ssh_port | string))
            fail_msg: "SSH port {{ ssh_port }} is not accessible through firewall"
            success_msg: "✓ SSH port {{ ssh_port }} is accessible through firewall"

    - name: "Verify port knocking sets exist in NFTables"
      when: not (tailscale_enabled | default(false) | bool) and (port_knocking_enabled | default(true) | bool)
      block:
        - name: Get NFTables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_knock_rules
          changed_when: false

        - name: Verify knock sets exist
          ansible.builtin.assert:
            that:
              - nft_knock_rules.stdout is search('knock4_stage1')
              - nft_knock_rules.stdout is search('knock6_stage1')
              - nft_knock_rules.stdout is search('knock4_passed')
              - nft_knock_rules.stdout is search('knock6_passed')
            fail_msg: "Port knocking sets not found in NFTables ruleset"
            success_msg: "✓ Port knocking sets exist for both IPv4 and IPv6"

    - name: "Verify port knocking sequence ports in NFTables"
      when: not (tailscale_enabled | default(false) | bool) and (port_knocking_enabled | default(true) | bool)
      block:
        - name: Get NFTables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_knock_ports
          changed_when: false

        - name: Verify knock sequence ports
          ansible.builtin.assert:
            that:
              - nft_knock_ports.stdout is search(port_knocking_sequence[0] | string)
              - nft_knock_ports.stdout is search(port_knocking_sequence[1] | string)
              - nft_knock_ports.stdout is search(port_knocking_sequence[2] | string)
            fail_msg: "Port knocking sequence ports not found in NFTables ruleset"
            success_msg: "✓ Port knocking sequence ports are configured"

    # ==============================================================================
    # HOSTNAME VERIFICATION (Requirement 14.29)
    # ==============================================================================

    - name: "Test 14.29: Verify system hostname matches configured value"
      when: system_hostname is defined and system_hostname | length > 0
      block:
        - name: Get current hostname
          ansible.builtin.command: hostname
          register: current_hostname
          changed_when: false

        - name: Verify hostname matches
          ansible.builtin.assert:
            that:
              - current_hostname.stdout == system_hostname
            fail_msg: "System hostname does not match configured value"
            success_msg: "✓ System hostname is {{ system_hostname }}"

    # ==============================================================================
    # FAIL2BAN VERIFICATION (Requirements 14.30-14.32)
    # ==============================================================================

    - name: "Test 14.30: Verify fail2ban service is active"
      block:
        - name: Check fail2ban service status
          ansible.builtin.systemd:
            name: fail2ban
          register: fail2ban_service

        - name: Verify fail2ban is active
          ansible.builtin.assert:
            that:
              - fail2ban_service.status.ActiveState == 'active'
            fail_msg: "Fail2ban service is not active"
            success_msg: "✓ Fail2ban service is active"

    - name: "Test 14.31: Verify fail2ban service is enabled"
      block:
        - name: Check fail2ban service enablement
          ansible.builtin.systemd:
            name: fail2ban
          register: fail2ban_service

        - name: Verify fail2ban is enabled
          ansible.builtin.assert:
            that:
              - fail2ban_service.status.UnitFileState == 'enabled'
            fail_msg: "Fail2ban service is not enabled"
            success_msg: "✓ Fail2ban service is enabled"

    - name: "Test 14.32: Verify fail2ban is monitoring SSHD"
      block:
        - name: Check fail2ban status
          ansible.builtin.command: fail2ban-client status
          register: fail2ban_status
          changed_when: false

        - name: Verify sshd jail is active
          ansible.builtin.assert:
            that:
              - fail2ban_status.stdout is search('sshd')
            fail_msg: "Fail2ban is not monitoring SSHD"
            success_msg: "✓ Fail2ban is monitoring SSHD"

    # ==============================================================================
    # JOURNALD VERIFICATION (Requirement 14.33)
    # ==============================================================================

    - name: "Test 14.33: Verify journald is configured to persist logs"
      block:
        - name: Check journald configuration
          ansible.builtin.slurp:
            path: /etc/systemd/journald.conf
          register: journald_config

        - name: Verify persistent storage
          ansible.builtin.assert:
            that:
              - journald_config.content | b64decode is search('Storage=persistent')
            fail_msg: "Journald is not configured for persistent storage"
            success_msg: "✓ Journald is configured for persistent storage"

    # ==============================================================================
    # TIME SYNCHRONIZATION VERIFICATION (Requirements 14.34-14.36)
    # ==============================================================================

    - name: "Test 14.34: Verify time sync service is active"
      block:
        - name: Check time sync service status (chrony)
          ansible.builtin.systemd:
            name: chrony
          register: chrony_service
          failed_when: false

        - name: Check time sync service status (timesyncd)
          ansible.builtin.systemd:
            name: systemd-timesyncd
          register: timesyncd_service
          failed_when: false
          when: chrony_service.status.ActiveState | default('inactive') != 'active'

        - name: Verify time sync service is active
          ansible.builtin.assert:
            that:
              - chrony_service.status.ActiveState == 'active' or timesyncd_service.status.ActiveState == 'active'
            fail_msg: "No time synchronization service is active"
            success_msg: "✓ Time synchronization service is active"

    - name: "Test 14.35: Verify time sync service is enabled"
      block:
        - name: Check time sync service enablement (chrony)
          ansible.builtin.systemd:
            name: chrony
          register: chrony_service
          failed_when: false

        - name: Check time sync service enablement (timesyncd)
          ansible.builtin.systemd:
            name: systemd-timesyncd
          register: timesyncd_service
          failed_when: false
          when: chrony_service.status.UnitFileState | default('disabled') != 'enabled'

        - name: Verify time sync service is enabled
          ansible.builtin.assert:
            that:
              - chrony_service.status.UnitFileState == 'enabled' or timesyncd_service.status.UnitFileState == 'enabled'
            fail_msg: "No time synchronization service is enabled"
            success_msg: "✓ Time synchronization service is enabled"

    - name: "Test 14.36: Verify time synchronization is active"
      block:
        - name: Check chrony tracking status
          ansible.builtin.command: chronyc tracking
          register: chrony_tracking
          changed_when: false
          failed_when: false

        - name: Check timesyncd status
          ansible.builtin.command: timedatectl show-timesync --all
          register: timesyncd_status
          changed_when: false
          failed_when: false
          when: chrony_tracking.rc != 0

        - name: Verify time sync is working
          ansible.builtin.assert:
            that:
              - chrony_tracking.rc == 0 or timesyncd_status.rc == 0
            fail_msg: "Time synchronization is not working"
            success_msg: "✓ Time synchronization is active"

    # ==============================================================================
    # SWAP CONFIGURATION VERIFICATION (Requirements 14.37-14.43)
    # ==============================================================================

    - name: "Test 14.37: Verify zram device exists"
      when: zram_enabled | default(false)
      block:
        - name: Check for zram device
          ansible.builtin.stat:
            path: /dev/zram0
          register: zram_device

        - name: Verify zram device exists
          ansible.builtin.assert:
            that:
              - zram_device.stat.exists
            fail_msg: "Zram device does not exist"
            success_msg: "✓ Zram device exists"

    - name: "Test 14.38: Verify zram device is active as swap"
      when: zram_enabled | default(false)
      block:
        - name: Get swap status
          ansible.builtin.command: swapon --show
          register: swap_status
          changed_when: false

        - name: Verify zram swap is active
          ansible.builtin.assert:
            that:
              - swap_status.stdout is search('/dev/zram0')
            fail_msg: "Zram device is not active as swap"
            success_msg: "✓ Zram device is active as swap"

    - name: "Test 14.39: Verify zram compression algorithm is lz4"
      when: zram_enabled | default(false)
      block:
        - name: Check zram compression algorithm
          ansible.builtin.command: cat /sys/block/zram0/comp_algorithm
          register: zram_comp
          changed_when: false

        - name: Verify lz4 compression
          ansible.builtin.assert:
            that:
              - zram_comp.stdout is search('lz4')
            fail_msg: "Zram compression algorithm is not lz4"
            success_msg: "✓ Zram compression algorithm is lz4"

    - name: "Test 14.40: Verify zram has higher priority than disk swap"
      when: zram_enabled | default(false) and disk_swap_size is defined and disk_swap_size | length > 0
      block:
        - name: Get swap priorities
          ansible.builtin.command: swapon --show
          register: swap_status
          changed_when: false

        - name: Verify zram priority
          ansible.builtin.assert:
            that:
              - swap_status.stdout is search('/dev/zram0.*100')
            fail_msg: "Zram does not have priority 100"
            success_msg: "✓ Zram has priority 100 (higher than disk swap)"

    - name: "Test 14.41: Verify disk swap file exists"
      when: disk_swap_size is defined and disk_swap_size | length > 0
      block:
        - name: Check for swap file
          ansible.builtin.stat:
            path: /swapfile
          register: swap_file

        - name: Verify swap file exists
          ansible.builtin.assert:
            that:
              - swap_file.stat.exists
              - swap_file.stat.mode == '0600'
            fail_msg: "Swap file does not exist or has incorrect permissions"
            success_msg: "✓ Swap file exists with correct permissions"

    - name: "Test 14.42: Verify disk swap file is active"
      when: disk_swap_size is defined and disk_swap_size | length > 0
      block:
        - name: Get swap status
          ansible.builtin.command: swapon --show
          register: swap_status
          changed_when: false

        - name: Verify disk swap is active
          ansible.builtin.assert:
            that:
              - swap_status.stdout is search('/swapfile')
            fail_msg: "Disk swap file is not active"
            success_msg: "✓ Disk swap file is active"

    - name: "Test 14.43: Verify disk swap file is in fstab"
      when: disk_swap_size is defined and disk_swap_size | length > 0
      block:
        - name: Check fstab for swap entry
          ansible.builtin.command: grep /swapfile /etc/fstab
          register: fstab_swap
          changed_when: false
          failed_when: false

        - name: Verify swap in fstab
          ansible.builtin.assert:
            that:
              - fstab_swap.rc == 0
              - fstab_swap.stdout is search('swap')
            fail_msg: "Disk swap file is not in /etc/fstab"
            success_msg: "✓ Disk swap file is in /etc/fstab"

    # ==============================================================================
    # FILESYSTEM HARDENING VERIFICATION
    # ==============================================================================

    - name: "Verify /tmp has noexec,nosuid,nodev"
      block:
        - name: Get mount options for /tmp
          ansible.builtin.command: findmnt -n -o OPTIONS /tmp
          register: tmp_mount_options
          changed_when: false
          failed_when: false

        - name: Check /tmp mount options
          ansible.builtin.assert:
            that:
              - tmp_mount_options.rc == 0
              - tmp_mount_options.stdout is search('noexec')
              - tmp_mount_options.stdout is search('nosuid')
              - tmp_mount_options.stdout is search('nodev')
            fail_msg: "/tmp does not have required mount options (noexec,nosuid,nodev). Got: {{ tmp_mount_options.stdout | default('N/A') }}"
            success_msg: "✓ /tmp is mounted with noexec,nosuid,nodev"

    - name: "Verify /dev/shm has noexec,nosuid,nodev"
      block:
        - name: Get mount options for /dev/shm
          ansible.builtin.command: findmnt -n -o OPTIONS /dev/shm
          register: shm_mount_options
          changed_when: false
          failed_when: false

        - name: Check /dev/shm mount options
          ansible.builtin.assert:
            that:
              - shm_mount_options.rc == 0
              - shm_mount_options.stdout is search('noexec')
              - shm_mount_options.stdout is search('nosuid')
              - shm_mount_options.stdout is search('nodev')
            fail_msg: "/dev/shm does not have required mount options (noexec,nosuid,nodev). Got: {{ shm_mount_options.stdout | default('N/A') }}"
            success_msg: "✓ /dev/shm is mounted with noexec,nosuid,nodev"

    - name: "Verify /var/tmp has noexec,nosuid,nodev"
      block:
        - name: Get mount options for /var/tmp
          ansible.builtin.command: findmnt -n -o OPTIONS /var/tmp
          register: var_tmp_mount_options
          changed_when: false
          failed_when: false

        - name: Check /var/tmp mount options
          ansible.builtin.assert:
            that:
              - var_tmp_mount_options.rc == 0
              - var_tmp_mount_options.stdout is search('noexec')
              - var_tmp_mount_options.stdout is search('nosuid')
              - var_tmp_mount_options.stdout is search('nodev')
            fail_msg: "/var/tmp does not have required mount options (noexec,nosuid,nodev). Got: {{ var_tmp_mount_options.stdout | default('N/A') }}"
            success_msg: "✓ /var/tmp is mounted with noexec,nosuid,nodev"

    # ==============================================================================
    # LOGIN POLICY HARDENING VERIFICATION
    # ==============================================================================

    - name: "Verify login.defs hardening"
      block:
        - name: Read login.defs
          ansible.builtin.slurp:
            path: /etc/login.defs
          register: login_defs_content

        - name: Verify hardened login.defs settings
          ansible.builtin.assert:
            that:
              - >-
                login_defs_content.content | b64decode is search('UMASK.*' +
                (login_policy_umask | default(users_role_defaults.login_policy_umask) | string))
              - >-
                login_defs_content.content | b64decode is search('LOGIN_RETRIES.*' +
                (login_policy_retries | default(users_role_defaults.login_policy_retries) | string))
              - >-
                login_defs_content.content | b64decode is search('LOGIN_TIMEOUT.*' +
                (login_policy_timeout | default(users_role_defaults.login_policy_timeout) | string))
              - login_defs_content.content | b64decode is search('LOG_OK_LOGINS.*yes')
            fail_msg: "login.defs hardening is missing or incomplete"
            success_msg: >-
              ✓ login.defs is hardened (UMASK {{ login_policy_umask | default(users_role_defaults.login_policy_umask) }},
              LOGIN_RETRIES {{ login_policy_retries | default(users_role_defaults.login_policy_retries) }},
              LOGIN_TIMEOUT {{ login_policy_timeout | default(users_role_defaults.login_policy_timeout) }},
              LOG_OK_LOGINS yes)

    - name: "Verify securetty and shell timeout"
      block:
        - name: Check securetty exists
          ansible.builtin.stat:
            path: /etc/securetty
          register: securetty_file

        - name: Read securetty
          ansible.builtin.slurp:
            path: /etc/securetty
          register: securetty_content
          when: securetty_file.stat.exists

        - name: Check shell timeout exists
          ansible.builtin.stat:
            path: /etc/profile.d/shell-timeout.sh
          register: shell_timeout_file

        - name: Read shell timeout
          ansible.builtin.slurp:
            path: /etc/profile.d/shell-timeout.sh
          register: shell_timeout_content
          when: shell_timeout_file.stat.exists

        - name: Verify securetty and shell timeout
          ansible.builtin.assert:
            that:
              - securetty_file.stat.exists
              - securetty_content.content | b64decode is search('tty1')
              - shell_timeout_file.stat.exists
              - shell_timeout_content.content | b64decode is search('TMOUT')
            fail_msg: "Securetty or shell timeout is missing"
            success_msg: "✓ Securetty deployed, shell timeout active"


    # ==============================================================================
    # PAM HARDENING VERIFICATION
    # ==============================================================================

    - name: "Verify faillock configuration"
      block:
        - name: Read faillock.conf
          ansible.builtin.slurp:
            path: /etc/security/faillock.conf
          register: faillock_conf_content

        - name: Verify faillock.conf settings
          ansible.builtin.assert:
            that:
              - faillock_conf_content.content | b64decode is search('deny.*' + (pam_faillock_deny | default(users_role_defaults.pam_faillock_deny) | string))
              - faillock_conf_content.content | b64decode is search('even_deny_root.*true')
            fail_msg: "faillock.conf is missing or incomplete"
            success_msg: >-
              ✓ faillock.conf deployed (deny {{ pam_faillock_deny | default(users_role_defaults.pam_faillock_deny) }},
              even_deny_root true)

        - name: Check faillock preauth PAM profile exists
          ansible.builtin.stat:
            path: /usr/share/pam-configs/faillock-preauth
          register: faillock_preauth_profile

        - name: Check faillock authfail PAM profile exists
          ansible.builtin.stat:
            path: /usr/share/pam-configs/faillock-authfail
          register: faillock_authfail_profile

        - name: Check legacy faillock PAM profile is absent
          ansible.builtin.stat:
            path: /usr/share/pam-configs/faillock
          register: faillock_legacy_profile

        - name: Read common-auth to verify faillock ordering
          ansible.builtin.command:
            cmd: grep -n 'pam_faillock\|pam_unix' /etc/pam.d/common-auth
          register: pam_auth_ordering
          changed_when: false

        - name: Verify faillock PAM integration
          ansible.builtin.assert:
            that:
              - faillock_preauth_profile.stat.exists
              - faillock_authfail_profile.stat.exists
              - not faillock_legacy_profile.stat.exists
              - pam_auth_ordering.stdout is search('preauth.*\n.*pam_unix.*\n.*authfail')
            fail_msg: >-
              Faillock PAM profiles not deployed correctly or ordering is wrong
              in common-auth. Expected: preauth → pam_unix → authfail.
              Got: {{ pam_auth_ordering.stdout_lines | default([]) }}
            success_msg: "✓ Faillock enabled in PAM (preauth → pam_unix → authfail)"

    - name: "Verify resource limits"
      block:
        - name: Check resource limits file exists
          ansible.builtin.stat:
            path: /etc/security/limits.d/50-hardening.conf
          register: limits_file

        - name: Read resource limits
          ansible.builtin.slurp:
            path: /etc/security/limits.d/50-hardening.conf
          register: limits_content
          when: limits_file.stat.exists

        - name: Verify resource limits
          ansible.builtin.assert:
            that:
              - limits_file.stat.exists
              - limits_content.content | b64decode is search('nproc')
              - limits_content.content | b64decode is search('core.*0')
            fail_msg: "Resource limits file is missing or incomplete"
            success_msg: "✓ Resource limits deployed (nproc, nofile, core)"

    # ==============================================================================
    # FINAL SUMMARY
    # ==============================================================================

    - name: "Test 14.44: Display verification summary"
      block:
        - name: Count test results
          ansible.builtin.set_fact:
            total_tests: "{{ ansible_play_batch | length }}"

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "VPS Bootstrap Verification Complete"
              - "=========================================="
              - "All verification tests passed successfully!"
              - ""
              - "Configuration verified:"
              - "  ✓ User accounts and sudo privileges"
              - "  ✓ Sudo hardening (env sanitization, logging, timeouts, su restriction)"
              - "  ✓ SSH hardening and access restrictions"
              - "  ✓ Tailscale VPN (if enabled)"
              - "  ✓ NFTables firewall rules"
              - "  ✓ Fail2ban intrusion prevention"
              - "  ✓ System logging configuration"
              - "  ✓ Time synchronization"
              - "  ✓ Swap configuration (if enabled)"
              - "  ✓ Hostname configuration (if set)"
              - "  ✓ Filesystem hardening (noexec on tmp directories)"
              - "  ✓ Login policy hardening (TMOUT, securetty, login.defs)"
              - "  ✓ PAM hardening (faillock account lockout, resource limits)"
              - ""
              - "The VPS is properly configured and ready for use."
              - "=========================================="
